server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: smart-university
  servlet:
    # 保持接口文档约定的基础路径为 /api/v1，不再叠加业务级 context-path
    context-path: /
  # JSON 全局配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    throw-exception-if-no-handler-found: true
  # 数据库 / Redis：主机 IP 由各环境的 smart-university.server-ip 提供
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${smart-university.server-ip}:3306/edu_course_selection?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      pool-name: SmartUniversityHikariPool
      minimum-idle: 5
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${smart-university.server-ip}
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    jdbc-type-for-null: 'null'
  # 仅联表与复杂统计语句保留 XML，其余单表操作由 BaseMapper + Wrapper 完成
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.smart.university.domain.entity
  type-enums-package: com.smart.university.domain.enums
  global-config:
    db-config:
      # 主键统一为数据库自增
      id-type: auto
      # 逻辑删除未启用：业务使用 status 字段表达启停，语义与逻辑删除不同

# 平台自定义配置
smart-university:
  # 服务器统一 IP：MySQL / Redis 等所有服务均部署在该主机。
  # 该值按环境拆分：开发环境见 application-dev.yml，生产环境见 application-prod.yml
  # 接口统一前缀，与接口文档 V1 保持一致
  api-prefix: /api/v1
  auth:
    # JWT 签名密钥，生产环境必须替换为随机值并通过环境变量注入
    jwt-secret: smart-university-default-jwt-secret-please-change
    # Token 有效期（秒），默认 8 小时
    token-ttl: 28800
    # 免鉴权路径，多个使用英文逗号分隔
    exclude-paths: /api/v1/auth/login,/error
  # 选课并发控制开关：false 走纯数据库事务，true 走 Redis 预扣减
  # V1.1 曾因两套容量口径（选课走 Redis 预扣、候补看数据库统计）漂移而关闭；
  # V1.2 由 W1 统一容量服务后口径收敛，按架构设计 §12.8 打开该开关
  selection:
    redis-deduct-enabled: true
    # 容量计数 Key 过期时间（秒）
    capacity-key-ttl-seconds: 86400
    # 降级标记过期时间（秒）
    degraded-flag-ttl-seconds: 60
    # 容量缓存预热单轮扫描条数上限
    warmup-scan-limit: 500
  # 热点基础数据缓存（P-06）
  cache:
    hot-data-enabled: true
    hot-data-ttl-seconds: 43200
  # 自动化任务总开关、分布式锁租约与各任务周期（架构设计 §6.2 / §6.4）
  schedule:
    enabled: true
    lock-lease-seconds: 300
    tasks:
      batch-status:            { enabled: true,  fixed-delay: 60000 }
      waitlist-scan:           { enabled: true,  fixed-delay: 300000 }
      stat-snapshot:           { enabled: true,  cron: "0 0 2 * * ?" }
      dashboard-refresh:       { enabled: true,  fixed-delay: 600000 }
      credit-warning:          { enabled: true,  cron: "0 0 9 ? * MON" }
      data-audit:              { enabled: true,  cron: "0 0 3 * * ?" }
      semester-archive:        { enabled: false, cron: "0 0 4 * * ?" }
      cache-reconcile:         { enabled: true,  fixed-delay: 1800000 }
      selection-cache-warmup:  { enabled: true,  cron: "0 0/30 * * * ?" }
  # 统计口径可配项（架构设计 §12.8）
  statistics:
    classroom-usage:
      # 每周计天数，决策 5 / Q7 已拍板：默认 5 天
      days-per-week: 5
      # 每天计节次，决策 5 / Q7 已拍板：默认 10 节
      sections-per-day: 10
      # 学期周数推导上限
      max-weeks-per-semester: 20
    teacher-workload:
      # Q8 决议 A：不引入课程系数
      credit-factor-enabled: false
    credit:
      # 决策 1 / Q10：已发布即计入，不判及格
      publish-as-earned: true
      # 仅用于计算附加字段 passedCredit，不作为计入门槛
      pass-score: 60
      # C9：同一课程重修多次是否去重，默认不去重
      dedup-by-course: false
    graduation-risk:
      default-school-years: 4
      high-rate: 0.8
      medium-rate: 0.6
    enrollment-forecast:
      expansion-factor: 1.2
      min-history-sample: 2
    score-anomaly:
      pass-rate-deviation: 15
      excellent-rate-threshold: 60
  # 统计快照扫描与保留策略
  snapshot:
    scan-limit: 500
    # Q12 决议 A：每学期只保留最新一份
    retain-days: 1

# Knife4j / OpenAPI 接口文档配置
knife4j:
  # 启用文档聚合（Knife4j 4.x 基于 springdoc-openapi）
  enable: true
  setting:
    # 文档界面语言，中文
    language: zh-CN
    # 显示接口分组与版本
    enable-version: true
    # 调试时默认展开接口详情
    default-expand-depth: 1

# springdoc-openapi 基础配置（Knife4j 底层依赖）
springdoc:
  api-docs:
    # OpenAPI JSON 描述路径，Knife4j 文档页会自动加载
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.smart.university: info
    # 需要排查 SQL 时把该行改为 debug
    com.smart.university.mapper: info
