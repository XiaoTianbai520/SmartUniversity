server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: smart-university
  servlet:
    # 保持接口文档约定的基础路径为 /api/v1，不再叠加业务级 context-path
    context-path: /
  # JSON 全局配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    throw-exception-if-no-handler-found: true
  # 数据库 / Redis：主机 IP 由各环境的 smart-university.server-ip 提供
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${smart-university.server-ip}:3306/edu_course_selection?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      pool-name: SmartUniversityHikariPool
      minimum-idle: 5
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${smart-university.server-ip}
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    jdbc-type-for-null: 'null'
  # 仅联表与复杂统计语句保留 XML，其余单表操作由 BaseMapper + Wrapper 完成
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.smart.university.domain.entity
  type-enums-package: com.smart.university.domain.enums
  global-config:
    db-config:
      # 主键统一为数据库自增
      id-type: auto
      # 逻辑删除未启用：业务使用 status 字段表达启停，语义与逻辑删除不同

# 平台自定义配置
smart-university:
  # 服务器统一 IP：MySQL / Redis / RocketMQ 等所有服务均部署在该主机。
  # 该值按环境拆分：开发环境见 application-dev.yml，生产环境见 application-prod.yml
  # 接口统一前缀，与接口文档 V1 保持一致
  api-prefix: /api/v1
  auth:
    # JWT 签名密钥，生产环境必须替换为随机值并通过环境变量注入
    jwt-secret: smart-university-default-jwt-secret-please-change
    # Token 有效期（秒），默认 8 小时
    token-ttl: 28800
    # 免鉴权路径，多个使用英文逗号分隔
    exclude-paths: /api/v1/auth/login,/error
  # 选课并发控制开关：false 走纯数据库事务，true 走 Redis 预扣减 + MQ 异步落库
  selection:
    redis-deduct-enabled: true
  # 消息队列开关：本地没有 RocketMQ 环境时可置为 false，应用仍可正常启动
  mq:
    enabled: true

rocketmq:
  name-server: ${smart-university.server-ip}:9876
  producer:
    group: edu_smart-university_course-selection_pg
    send-message-timeout: 2000
    retry-times-when-send-failed: 2

logging:
  level:
    root: info
    com.smart.university: info
    # 需要排查 SQL 时把该行改为 debug
    com.smart.university.mapper: info
